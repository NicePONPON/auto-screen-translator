name: Build Auto Screen Translator for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up portable Python environment
        shell: pwsh
        run: |
          $pyVer  = "3.11.9"
          $outDir = "dist\AutoScreenTranslator"
          $pyDir  = "$outDir\python"
          New-Item -ItemType Directory -Path $pyDir -Force | Out-Null
          Write-Host "==> Downloading Python $pyVer embeddable..."
          Invoke-WebRequest "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip" -OutFile "py-embed.zip"
          Expand-Archive "py-embed.zip" -DestinationPath $pyDir
          $pth = Get-ChildItem $pyDir -Filter "*._pth" | Select-Object -First 1 -ExpandProperty FullName
          (Get-Content $pth) -replace '#import site','import site' | Set-Content $pth
          Write-Host "==> Installing pip..."
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          & "$pyDir\python.exe" get-pip.py --quiet --no-warn-script-location
          Write-Host "==> Installing CPU-only PyTorch..."
          & "$pyDir\python.exe" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --quiet --no-user --no-warn-script-location
          Write-Host "==> Installing app dependencies..."
          & "$pyDir\python.exe" -m pip install -r requirements.txt --quiet --no-user --no-warn-script-location
          Write-Host "==> Python environment ready."

      - name: Generate app icon
        shell: pwsh
        run: |
          $pyDir = "dist\AutoScreenTranslator\python"
          $script = "from PIL import Image,ImageDraw; make=lambda s:(Image.new('RGBA',(s,s),(0,0,0,0))); frames=[]; [frames.append((lambda i,d: (d.rounded_rectangle([0,0,s-1,s-1],radius=s//6,fill=(28,28,28,255)),d.ellipse([s//5,s//5,s-s//5-1,s-s//5-1],fill=(58,123,213,255)),d.rectangle([s//2-s//3,s//2-s//10,s//2+s//3,s//2+s//10],fill='white'),d.rectangle([s//2-s//10,s//2-s//3,s//2+s//10,s//2+s//3],fill='white'),i)[-1])(make(s),ImageDraw.Draw(make(s)))) for s in [256,128,64,48,32,16]]; [frames[0].save('winres/icon.ico',format='ICO',sizes=[(s,s) for s in [256,128,64,48,32,16]],append_images=frames[1:])]"
          & "$pyDir\python.exe" -c $script
          Write-Host "==> Icon generated."

      - name: Compile launcher exe with icon
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres/cmd/go-winres@latest
          $gobin = (go env GOPATH) + '\bin'
          & "$gobin\go-winres.exe" make --in winres\winres.json
          go build -ldflags "-H windowsgui" -o "dist\AutoScreenTranslator\AutoScreenTranslator.exe" .
          Write-Host "==> Launcher compiled with icon."

      - name: Copy source files
        shell: pwsh
        run: |
          $files = @("main.py","settings.py","translator.py","ocr_engine.py","capture.py","overlay.py","toolbar.py")
          foreach ($f in $files) { Copy-Item $f "dist\AutoScreenTranslator\" }
          Write-Host "==> Source files copied."

      - name: Create README in package
        shell: pwsh
        run: |
          "Double-click AutoScreenTranslator.exe to launch the app." | Out-File -FilePath "dist\AutoScreenTranslator\HOW_TO_RUN.txt" -Encoding utf8

      - name: Zip output with 7-Zip
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -tzip "AutoScreenTranslator-Windows.zip" ".\dist\AutoScreenTranslator\*"
          Write-Host "==> Zip created."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoScreenTranslator-Windows
          path: AutoScreenTranslator-Windows.zip
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>$null
          git push --delete origin latest 2>$null
          gh release create latest --title "Auto Screen Translator - Latest Build" --notes-file release-notes.md --latest "AutoScreenTranslator-Windows.zip"
