name: Build Auto Screen Translator for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-torch-cpu

      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install app dependencies and PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path "dist\AutoScreenTranslator\*" -DestinationPath "AutoScreenTranslator-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoScreenTranslator-Windows
          path: AutoScreenTranslator-Windows.zip
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>$null
          git push --delete origin latest 2>$null
          gh release create latest --title "Auto Screen Translator - Latest Build" --notes-file release-notes.md --latest "AutoScreenTranslator-Windows.zip"
