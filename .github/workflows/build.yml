name: Build Auto Screen Translator for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up portable Python environment
        shell: pwsh
        run: |
          $pyVer  = "3.11.9"
          $outDir = "dist\AutoScreenTranslator"
          $pyDir  = "$outDir\python"
          New-Item -ItemType Directory -Path $pyDir -Force | Out-Null

          Write-Host "==> Downloading Python $pyVer embeddable..."
          Invoke-WebRequest "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip" -OutFile "py-embed.zip"
          Expand-Archive "py-embed.zip" -DestinationPath $pyDir

          # Enable site-packages so pip-installed packages are importable
          $pth = Get-ChildItem $pyDir -Filter "*._pth" | Select-Object -First 1 -ExpandProperty FullName
          (Get-Content $pth) -replace '#import site','import site' | Set-Content $pth

          Write-Host "==> Installing pip..."
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          & "$pyDir\python.exe" get-pip.py --quiet --no-warn-script-location

          Write-Host "==> Installing CPU-only PyTorch..."
          & "$pyDir\python.exe" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --quiet --no-user --no-warn-script-location

          Write-Host "==> Installing app dependencies..."
          & "$pyDir\python.exe" -m pip install -r requirements.txt --quiet --no-user --no-warn-script-location

          Write-Host "==> Python environment ready."

      - name: Compile launcher exe
        shell: pwsh
        run: |
          go build -ldflags "-H windowsgui" -o "dist\AutoScreenTranslator\AutoScreenTranslator.exe" launcher.go
          Write-Host "==> Launcher compiled."

      - name: Copy source files
        shell: pwsh
        run: |
          $files = @("main.py","settings.py","translator.py","ocr_engine.py","capture.py","overlay.py","toolbar.py")
          foreach ($f in $files) { Copy-Item $f "dist\AutoScreenTranslator\" }
          Write-Host "==> Source files copied."

      - name: Zip output
        shell: pwsh
        run: Compress-Archive -Path "dist\AutoScreenTranslator\*" -DestinationPath "AutoScreenTranslator-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoScreenTranslator-Windows
          path: AutoScreenTranslator-Windows.zip
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>$null
          git push --delete origin latest 2>$null
          gh release create latest --title "Auto Screen Translator - Latest Build" --notes-file release-notes.md --latest "AutoScreenTranslator-Windows.zip"
