name: Build Auto Screen Translator for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up portable Python environment
        shell: pwsh
        run: |
          $pyVer  = "3.11.9"
          $outDir = "dist\AutoScreenTranslator"
          $pyDir  = "$outDir\python"
          New-Item -ItemType Directory -Path $pyDir -Force | Out-Null
          Write-Host "==> Downloading Python $pyVer embeddable..."
          Invoke-WebRequest "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip" -OutFile "py-embed.zip"
          Expand-Archive "py-embed.zip" -DestinationPath $pyDir
          $pth = Get-ChildItem $pyDir -Filter "*._pth" | Select-Object -First 1 -ExpandProperty FullName
          (Get-Content $pth) -replace '#import site','import site' | Set-Content $pth
          Write-Host "==> Installing pip..."
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          & "$pyDir\python.exe" get-pip.py --quiet --no-warn-script-location
          Write-Host "==> Installing app dependencies..."
          & "$pyDir\python.exe" -m pip install Pillow certifi PyQt6 deep-translator winsdk --quiet --no-user --no-warn-script-location
          Write-Host "==> Python environment ready."
          # qt.conf tells Qt where its platform plugins live (qwindows.dll etc.)
          # Without this PyQt6 silently fails to create any windows on embedded Python.
          "[Paths]`r`nPlugins = Lib/site-packages/PyQt6/Qt6/plugins" | Out-File -FilePath "$pyDir\qt.conf" -Encoding ascii
          Write-Host "==> qt.conf written."

      - name: Copy source files and create launcher
        shell: pwsh
        run: |
          $files = @("main.py","settings.py","languages.py","capture.py","toolbar.py","ocr_engine.py","translator_client.py","translation_card.py","translation_panel.py")
          foreach ($f in $files) { Copy-Item $f "dist\AutoScreenTranslator\" }
          $bat = '@echo off' + "`r`n" + 'start "" "%~dp0python\pythonw.exe" "%~dp0main.py"'
          [System.IO.File]::WriteAllText("dist\AutoScreenTranslator\AutoScreenTranslator.bat", $bat)
          "Double-click AutoScreenTranslator.bat to launch the app." | Out-File -FilePath "dist\AutoScreenTranslator\HOW_TO_RUN.txt" -Encoding utf8
          Write-Host "==> Files copied."

      - name: Zip output with 7-Zip
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -tzip "AutoScreenTranslator-Windows.zip" ".\dist\AutoScreenTranslator\*"
          Write-Host "==> Zip created."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoScreenTranslator-Windows
          path: AutoScreenTranslator-Windows.zip
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>$null
          git push --delete origin latest 2>$null
          gh release create latest --title "Auto Screen Translator - Latest Build" --notes-file release-notes.md --latest "AutoScreenTranslator-Windows.zip"
